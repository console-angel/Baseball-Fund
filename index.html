<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Baseball Fund — Order Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    touch-action: manipulation;
    overscroll-behavior-y: none;
  }

  :root {
    --green: #1a6b3a;
    --green-light: #e8f5ee;
    --green-mid: #2e8b57;
    --amber: #d4890a;
    --amber-light: #fef3dc;
    --red: #c0392b;
    --red-light: #fdecea;
    --bg: #f6f4f0;
    --surface: #ffffff;
    --border: #e0dcd5;
    --text: #1c1a17;
    --muted: #6b6560;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    min-height: 100vh;
    padding: 0 0 220px;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    touch-action: pan-y;
  }

  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    background: var(--green);
    color: white;
    text-align: center;
    padding: 22px 16px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    position: sticky;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .header-title-wrap {
    flex: 1;
    min-width: 0;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 0.04em;
    font-weight: normal;
  }

  header p {
    font-size: 13px;
    opacity: 0.75;
    margin-top: 4px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.08em;
  }

  .btn-export {
    border: 1.5px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.12);
    color: white;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 10px 12px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }

  .btn-export:active {
    background: rgba(255,255,255,0.2);
  }

  .section-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 22px 16px 10px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 12px;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item-card.combo {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .item-card.deal {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    background: var(--amber-light);
    border-color: #f0c060;
  }

  .item-name {
    font-size: 15px;
    font-weight: bold;
    color: var(--text);
    line-height: 1.2;
  }

  .combo .item-name, .deal .item-name {
    flex: 1;
  }

  .item-desc {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
  }

  .item-price {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: var(--green);
    font-weight: bold;
    margin-top: 2px;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    transition: background 0.1s, border-color 0.1s;
    font-family: monospace;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .qty-btn:active { background: #e0dcd5; }
  .qty-btn.plus { background: var(--green); border-color: var(--green); color: white; }
  .qty-btn.plus:active { background: var(--green-mid); }

  .qty-val {
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: bold;
    min-width: 24px;
    text-align: center;
    color: var(--text);
  }

  .qty-val.nonzero { color: var(--green); }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 16px max(16px, env(safe-area-inset-bottom));
    z-index: 200;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .total-label {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .total-amount {
    font-size: 28px;
    font-weight: bold;
    color: var(--green);
    font-family: 'Courier New', monospace;
  }

  .footer-actions {
    display: flex;
    gap: 10px;
  }

  .orders-status {
    margin-top: 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.3;
  }

  .orders-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .btn-clear-saved {
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }

  .btn-clear {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-clear:active { background: var(--bg); }

  .btn-summary {
    flex: 2;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--green);
    color: white;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-summary:active { background: var(--green-mid); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
    touch-action: none;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    width: 100%;
    max-width: 480px;
    padding: 24px 20px max(32px, env(safe-area-inset-bottom));
    max-height: 80vh;
    overflow-y: auto;
    touch-action: pan-y;
  }

  .modal h2 {
    font-size: 18px;
    margin-bottom: 18px;
    font-weight: normal;
    letter-spacing: 0.03em;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .saved-order-block {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .saved-order-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .saved-order-lines {
    margin-top: 4px;
  }

  .btn-modal {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }

  .summary-row:last-of-type { border-bottom: none; }

  .summary-total {
    display: flex;
    justify-content: space-between;
    padding: 14px 0 0;
    font-size: 20px;
    font-weight: bold;
    border-top: 2px solid var(--text);
    margin-top: 8px;
    font-family: 'Courier New', monospace;
  }

  .btn-close {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
    color: var(--muted);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .payment-section {
    display: none;
    margin-top: 20px;
  }

  .payment-section.active {
    display: block;
  }

  .payment-display {
    background: var(--green-light);
    border: 1px solid #2e8b57;
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 16px;
    text-align: center;
  }

  .payment-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .payment-amount {
    font-size: 32px;
    font-weight: bold;
    color: var(--green);
    font-family: 'Courier New', monospace;
    word-break: break-all;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .keypad-btn {
    padding: 16px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    transition: background 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .keypad-btn:active {
    background: var(--bg);
  }

  .keypad-btn.delete {
    grid-column: 1 / 3;
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
  }

  .keypad-btn.delete:active {
    background: #f0b3ad;
  }

  .keypad-btn.decimal {
    grid-column: 3;
    font-size: 24px;
  }

  .change-display {
    background: var(--amber-light);
    border: 1px solid #f0c060;
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 16px;
    text-align: center;
  }

  .change-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .change-amount {
    font-size: 28px;
    font-weight: bold;
    color: var(--green);
    font-family: 'Courier New', monospace;
  }

  .btn-payment {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--green);
    color: white;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    font-weight: bold;
  }

  .btn-payment:active {
    background: var(--green-mid);
  }

  .btn-payment:disabled {
    background: var(--muted);
    cursor: not-allowed;
    opacity: 0.6;
  }

  .change-display.hidden {
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-title-wrap">
      <h1>&#9918; Baseball Fund</h1>
      <p>FRI &mdash; SAT &mdash; SUN</p>
    </div>
    <button class="btn-export" onclick="exportCSV()">Export CSV</button>
  </div>
</header>

<div class="section-label">Individual Items</div>
<div class="items-grid" id="items-grid"></div>

<div class="section-label">Combos</div>
<div class="items-grid" id="combos-grid"></div>

<div class="section-label">Deals</div>
<div class="items-grid" id="deals-grid"></div>

<footer>
  <div class="total-row">
    <span class="total-label">Total</span>
    <span class="total-amount" id="total-display">$0.00</span>
  </div>
  <div class="footer-actions">
    <button class="btn-clear" onclick="clearAll()">Clear</button>
    
    <button class="btn-summary" onclick="openSummary()">View Order</button>
  </div>
  <div class="orders-controls">
    <div class="orders-status" id="orders-status">Saved orders: 0</div>
    <button class="btn-clear-saved" onclick="openSavedOrders()">View saved orders</button>
    <button class="btn-clear-saved" id="btn-clear-saved" onclick="clearSavedOrders()">Clear saved orders</button>
  </div>
</footer>

<div class="modal-overlay" id="modal-overlay" onclick="closeSummary(event)">
  <div class="modal" id="modal">
    <h2>Order Summary</h2>
    <div id="summary-lines"></div>
    <div class="summary-total">
      <span>Total</span>
      <span id="summary-total"></span>
    </div>
    <div id="payment-section" class="payment-section">
      <div class="payment-display">
        <div class="payment-label">Cash Amount</div>
        <div class="payment-amount" id="cash-display">$0.00</div>
      </div>
      <div class="keypad" id="keypad"></div>
      <div class="change-display hidden" id="change-display">
        <div class="change-label">Change</div>
        <div class="change-amount" id="change-amount">$0.00</div>
      </div>
    </div>
    <div class="modal-actions" id="modal-actions">
      <button class="btn-modal" onclick="payWithCard()">💳 Card</button>
      <button class="btn-modal" onclick="initCashPayment()">💵 Cash</button>
      <button class="btn-modal" onclick="closeSummary()">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="saved-orders-overlay" onclick="closeSavedOrders(event)">
  <div class="modal" id="saved-orders-modal">
    <h2>Saved Orders</h2>
    <div id="saved-orders-lines"></div>
    <div class="summary-total">
      <span>Saved total</span>
      <span id="saved-orders-total"></span>
    </div>
    <div class="modal-actions">
      <button class="btn-modal" onclick="closeSavedOrders()">Close</button>
    </div>
  </div>
</div>

<script>
const ITEMS = [
  { id: 'pizza',     name: 'Pizza',      price: 3, type: 'item' },
  { id: 'chips',     name: 'Chips',      price: 1, type: 'item' },
  { id: 'drink',     name: 'Drink',      price: 2, type: 'item' },
  { id: 'gatorade',  name: 'Gatorade',   price: 3, type: 'item' },
  { id: 'hotdog',    name: 'Hot Dog',    price: 4, type: 'item' },
  { id: 'nachos',    name: 'Nachos',     price: 4, type: 'item' },
  { id: 'candy',     name: 'Candy',      price: 3, type: 'item' },
  { id: 'icecream',  name: 'Ice Cream',  price: 3, type: 'item' },
  { id: 'fruitcups', name: 'Fruit Cups', price: 5, type: 'item' },
];

const COMBOS = [
  { id: 'combo1', name: 'Combo #1', price: 5, type: 'combo', desc: 'Pizza, Chips, Soda or Water' },
  { id: 'combo2', name: 'Combo #2', price: 5, type: 'combo', desc: 'Nachos w/ Any Drink' },
  { id: 'combo3', name: 'Combo #3', price: 6, type: 'combo', desc: 'Hot Dog, Chips, Soda or Water' },
];

const DEALS = [
  { id: 'deal1', name: '2 Pizza Slices', price: 5, type: 'deal', desc: 'Deal — save $1' },
];

const ALL = [...ITEMS, ...COMBOS, ...DEALS];
const qty = {};
ALL.forEach(i => qty[i.id] = 0);
const ORDERS_STORAGE_KEY = 'baseball-fund-orders';
let paymentState = {
  mode: null, // 'card' or 'cash'
  cashAmount: '',
};

function initializeKeypad() {
  const keypad = document.getElementById('keypad');
  const buttons = [
    { num: '1', click: () => addCashDigit('1') },
    { num: '2', click: () => addCashDigit('2') },
    { num: '3', click: () => addCashDigit('3') },
    { num: '4', click: () => addCashDigit('4') },
    { num: '5', click: () => addCashDigit('5') },
    { num: '6', click: () => addCashDigit('6') },
    { num: '7', click: () => addCashDigit('7') },
    { num: '8', click: () => addCashDigit('8') },
    { num: '9', click: () => addCashDigit('9') },
    { num: '.', click: () => addCashDigit('.'), class: 'decimal' },
    { num: '0', click: () => addCashDigit('0') },
    { num: 'DEL', click: deleteCashDigit, class: 'delete' },
  ];
  
  keypad.innerHTML = buttons.map(btn => 
    `<button class="keypad-btn ${btn.class || ''}" onclick="${btn.num === 'DEL' ? 'deleteCashDigit()' : `addCashDigit('${btn.num}')`}">${btn.num}</button>`
  ).join('');
}

function getSavedOrders() {
  try {
    const raw = localStorage.getItem(ORDERS_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function setSavedOrders(orders) {
  localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(orders));
  updateSavedOrdersStatus();
}

function buildOrderSnapshot() {
  const lines = ALL.filter(item => qty[item.id] > 0).map(item => ({
    id: item.id,
    name: item.name,
    type: item.type,
    quantity: qty[item.id],
    unitPrice: item.price,
    lineTotal: item.price * qty[item.id],
  }));
  const total = lines.reduce((sum, line) => sum + line.lineTotal, 0);
  return {
    orderId: 'ORD-' + Date.now(),
    savedAt: new Date().toISOString(),
    total,
    lines,
  };
}

function updateSavedOrdersStatus() {
  const orders = getSavedOrders();
  const el = document.getElementById('orders-status');
  if (el) {
    el.textContent = `Saved orders: ${orders.length}`;
  }
}

function syncFooterSpacing() {
  const footer = document.querySelector('footer');
  if (!footer) return;
  const spacing = footer.offsetHeight + 24;
  document.body.style.paddingBottom = spacing + 'px';
  document.documentElement.style.scrollPaddingBottom = spacing + 'px';
}

function clearSavedOrders() {
  localStorage.removeItem(ORDERS_STORAGE_KEY);
  updateSavedOrdersStatus();
}

function escapeCSV(value) {
  const text = String(value ?? '');
  if (/[",\n]/.test(text)) {
    return '"' + text.replace(/"/g, '""') + '"';
  }
  return text;
}

function downloadTextFile(filename, text, mimeType) {
  const blob = new Blob([text], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function renderCard(item) {
  const isCombo = item.type === 'combo';
  const isDeal = item.type === 'deal';
  const cls = isCombo ? 'item-card combo' : isDeal ? 'item-card deal' : 'item-card';
  const descHtml = item.desc ? `<div class="item-desc">${item.desc}</div>` : '';
  return `
    <div class="${cls}" id="card-${item.id}">
      <div>
        <div class="item-name">${item.name}</div>
        ${descHtml}
        <div class="item-price">$${item.price}</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn minus" onclick="change('${item.id}', -1)">&#8722;</button>
        <span class="qty-val" id="qty-${item.id}">0</span>
        <button class="qty-btn plus" onclick="change('${item.id}', 1)">+</button>
      </div>
    </div>`;
}

document.getElementById('items-grid').innerHTML = ITEMS.map(renderCard).join('');
document.getElementById('combos-grid').innerHTML = COMBOS.map(renderCard).join('');
document.getElementById('deals-grid').innerHTML = DEALS.map(renderCard).join('');

document.documentElement.style.webkitTextSizeAdjust = '100%';
document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
  document.addEventListener(type, event => event.preventDefault(), { passive: false });
});

updateSavedOrdersStatus();
syncFooterSpacing();
initializeKeypad();
window.addEventListener('resize', syncFooterSpacing);
window.addEventListener('orientationchange', syncFooterSpacing);

function change(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  const el = document.getElementById('qty-' + id);
  el.textContent = qty[id];
  el.className = qty[id] > 0 ? 'qty-val nonzero' : 'qty-val';
  updateTotal();
}

function updateTotal() {
  const total = ALL.reduce((sum, item) => sum + item.price * qty[item.id], 0);
  document.getElementById('total-display').textContent = '$' + total.toFixed(2);
}

function clearAll() {
  ALL.forEach(item => {
    qty[item.id] = 0;
    const el = document.getElementById('qty-' + item.id);
    if (el) { el.textContent = '0'; el.className = 'qty-val'; }
  });
  updateTotal();
}

function saveOrder() {
  // legacy: save without clearing (kept for compatibility)
  const hasItems = ALL.some(item => qty[item.id] > 0);
  if (!hasItems) {
    alert('Add items before saving the order.');
    return;
  }

  const order = buildOrderSnapshot();
  const orders = getSavedOrders();
  orders.push(order);
  setSavedOrders(orders);
}

function saveOrderFromModal() {
  const hasItems = ALL.some(item => qty[item.id] > 0);
  if (!hasItems) {
    alert('Add items before saving the order.');
    return;
  }
  const order = buildOrderSnapshot();
  const orders = getSavedOrders();
  orders.push(order);
  setSavedOrders(orders);
  // mimic Clear behaviour and dismiss modal
  clearAll();
  closeSummary();
}

function exportCSV() {
  const orders = getSavedOrders();
  if (!orders.length) return;

  // header: order_id, saved_at, [each item/combo name], order_total
  const itemNames = ALL.map(i => i.name);
  const itemIds = ALL.map(i => i.id);
  const header = ['order_id', 'saved_at', ...itemNames, 'order_total'];

  const rows = [header.map(escapeCSV).join(',')];

  orders.forEach(order => {
    const qtyMap = Object.fromEntries(itemIds.map(id => [id, 0]));
    order.lines.forEach(l => { qtyMap[l.id] = l.quantity; });
    const row = [order.orderId, order.savedAt, ...itemIds.map(id => String(qtyMap[id] || 0)), order.total.toFixed(2)];
    rows.push(row.map(escapeCSV).join(','));
  });

  const csv = rows.join('\n');
  downloadTextFile(`baseball-fund-orders-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8;');
}

function formatSavedOrderLines(order) {
  if (!order.lines.length) {
    return '<div class="summary-row"><span>No items</span><span>$0.00</span></div>';
  }

  return order.lines.map(line => `
    <div class="summary-row">
      <span>${line.name} x${line.quantity}</span>
      <span>$${line.lineTotal.toFixed(2)}</span>
    </div>
  `).join('');
}

function openSavedOrders() {
  const orders = getSavedOrders();
  const linesEl = document.getElementById('saved-orders-lines');
  const totalEl = document.getElementById('saved-orders-total');
  if (!orders.length) {
    linesEl.innerHTML = '';
    totalEl.textContent = '';
    document.getElementById('saved-orders-overlay').classList.add('open');
    return;
  }

  const total = orders.reduce((sum, order) => sum + (order.total || 0), 0);
  linesEl.innerHTML = orders.map((order, index) => `
    <div class="saved-order-block">
      <div class="saved-order-meta">
        <span>Order ${index + 1}</span>
        <span>${new Date(order.savedAt).toLocaleString()}</span>
      </div>
      <div class="saved-order-lines">
        ${formatSavedOrderLines(order)}
      </div>
      <div class="summary-total">
        <span>Order total</span>
        <span>$${(order.total || 0).toFixed(2)}</span>
      </div>
    </div>
  `).join('');
  totalEl.textContent = '$' + total.toFixed(2);
  document.getElementById('saved-orders-overlay').classList.add('open');
}

function closeSavedOrders(e) {
  if (!e || e.target === document.getElementById('saved-orders-overlay')) {
    document.getElementById('saved-orders-overlay').classList.remove('open');
  }
}

function openSummary() {
  resetPaymentState();
  const lines = ALL.filter(item => qty[item.id] > 0);
  const linesEl = document.getElementById('summary-lines');
  const totalEl = document.getElementById('summary-total');
  if (!lines.length) {
    linesEl.innerHTML = '';
    totalEl.textContent = '';
    document.getElementById('modal-overlay').classList.add('open');
    return;
  }

  const total = lines.reduce((s, i) => s + i.price * qty[i.id], 0);
  linesEl.innerHTML = lines.map(item =>
    `<div class="summary-row">
      <span>${item.name} x${qty[item.id]}</span>
      <span>$${(item.price * qty[item.id]).toFixed(2)}</span>
    </div>`
  ).join('');
  totalEl.textContent = '$' + total.toFixed(2);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeSummary(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
    resetPaymentState();
  }
}

function addCashDigit(digit) {
  if (digit === '.') {
    if (paymentState.cashAmount.includes('.')) return;
    if (!paymentState.cashAmount) paymentState.cashAmount = '0';
  }
  paymentState.cashAmount += digit;
  updateCashDisplay();
  updateSaveButtonState();
}

function deleteCashDigit() {
  paymentState.cashAmount = paymentState.cashAmount.slice(0, -1);
  updateCashDisplay();
  updateSaveButtonState();
}

function updateCashDisplay() {
  const display = document.getElementById('cash-display');
  const total = getCurrentOrderTotal();
  const cashAmount = parseFloat(paymentState.cashAmount) || 0;
  
  if (paymentState.cashAmount) {
    display.textContent = '$' + cashAmount.toFixed(2);
  } else {
    display.textContent = '$0.00';
  }

  const changeDisplay = document.getElementById('change-display');
  const changeAmount = document.getElementById('change-amount');
  
  if (cashAmount >= total && paymentState.cashAmount) {
    const change = cashAmount - total;
    changeAmount.textContent = '$' + change.toFixed(2);
    changeDisplay.classList.remove('hidden');
  } else {
    changeDisplay.classList.add('hidden');
  }
}

function getCurrentOrderTotal() {
  return ALL.reduce((sum, item) => sum + item.price * qty[item.id], 0);
}

function initCashPayment() {
  paymentState.mode = 'cash';
  paymentState.cashAmount = '';
  document.getElementById('payment-section').classList.add('active');
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-payment" id="save-cash-btn" onclick="saveOrderFromCash()" disabled>Save Order</button>
    <button class="btn-modal" onclick="cancelCashPayment()">Cancel</button>
  `;
  updateCashDisplay();
  updateSaveButtonState();
}

function updateSaveButtonState() {
  const btn = document.getElementById('save-cash-btn');
  if (btn) {
    const total = getCurrentOrderTotal();
    const cashAmount = parseFloat(paymentState.cashAmount) || 0;
    btn.disabled = cashAmount < total || !paymentState.cashAmount;
  }
}

function cancelCashPayment() {
  resetPaymentState();
  document.getElementById('payment-section').classList.remove('active');
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-modal" onclick="payWithCard()">💳 Card</button>
    <button class="btn-modal" onclick="initCashPayment()">💵 Cash</button>
    <button class="btn-modal" onclick="closeSummary()">Close</button>
  `;
}

function payWithCard() {
  saveOrderFromModal();
}

function saveOrderFromCash() {
  const hasItems = ALL.some(item => qty[item.id] > 0);
  if (!hasItems) {
    alert('Add items before saving the order.');
    return;
  }
  const order = buildOrderSnapshot();
  const orders = getSavedOrders();
  orders.push(order);
  setSavedOrders(orders);
  clearAll();
  closeSummary();
}

function resetPaymentState() {
  paymentState = {
    mode: null,
    cashAmount: '',
  };
  document.getElementById('payment-section').classList.remove('active');
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-modal" onclick="payWithCard()">💳 Card</button>
    <button class="btn-modal" onclick="initCashPayment()">💵 Cash</button>
    <button class="btn-modal" onclick="closeSummary()">Close</button>
  `;
}
</script>
</body>
</html>
